      ${state.profile.country === 'United States' ? `
      <label class="field-label">State</label>
      <select class="profile-input" onchange="App.onProfileState(this.value)">
        <option value="" ${!state.profile.state ? 'selected' : ''}>Select a state…</option>
        ${US_STATES.map(s => `<option value="${s}" ${state.profile.state === s ? 'selected' : ''}>${s}</option>`).join('')}
      </select>` : ''}

      <label class="field-label" style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
        <span>Appearance</span>
        <span style="display:flex;gap:6px;">
          <button type="button" class="modal-close" style="padding:5px 12px;font-size:12px;${state.profile.theme !== 'light' ? 'opacity:1;' : 'opacity:0.5;'}" onclick="App.onProfileTheme('dark')">Dark</button>
          <button type="button" class="modal-close" style="padding:5px 12px;font-size:12px;${state.profile.theme === 'light' ? 'opacity:1;' : 'opacity:0.5;'}" onclick="App.onProfileTheme('light')">Light</button>
        </span>
      </label>

      <label class="field-label" style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
        <span>Account recovery</span>
        ${state.profile.hasUsernameAuth
          ? `<span style="color:var(--gold);font-size:12px;">✓ Set up</span>`
          : `<button type="button" class="modal-close" style="padding:5px 12px;font-size:12px;" onclick="App.openSecureAccountModal()">Set up</button>`}
      </label>
      ${state.profile.hasUsernameAuth ? `<div class="modal-sub" style="margin-top:-4px;margin-bottom:10px;">Username: ${escapeHtml(state.profile.username)}</div>` : ''}

      <label class="field-label" style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
        <span>Show my score on the leaderboard</span>
        <input type="checkbox" ${state.profile.leaderboardOptIn ? 'checked' : ''} onchange="App.onProfileLeaderboardOptIn(this.checked)" />
      </label>

      <label class="field-label" style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
        <span>Hide points on my profile</span>
        <input type="checkbox" ${state.profile.hidePoints ? 'checked' : ''} onchange="App.onProfileHidePoints(this.checked)" />
      </label>

      <label class="field-label">Intention</label>
      <textarea class="profile-textarea" placeholder="Why are you keeping these niyams?"
        oninput="App.onProfileIntention(this.value)">${escapeHtml(state.profile.intention || '')}</textarea>

      <div class="profile-stats">
        <div class="pstat"><div class="pnum" style="font-size:15px;">${levelLabel(level)}</div><div class="plabel">Level</div></div>
        ${state.profile.hidePoints ? '' : `<div class="pstat"><div class="pnum">${pts}</div><div class="plabel">Total points</div></div>`}
        <div class="pstat"><div class="pnum">${streak}</div><div class="plabel">Current streak</div></div>
        <div class="pstat"><div class="pnum">${best}</div><div class="plabel">Best streak</div></div>
        <div class="pstat"><div class="pnum">${daysPracticed}</div><div class="plabel">Days practiced</div></div>
        <div class="pstat"><div class="pnum">${joinLabel}</div><div class="plabel">Member since</div></div>
      </div>

      <button class="modal-close" style="margin-top:12px;" onclick="App.showDashboard()">📊 View dashboard</button>

      <label class="field-label">Recent history</label>
      <div class="history-list">${recentHistoryHtml()}</div>

      <label class="field-label">Send progress report</label>
      <input class="profile-input" type="email" value="${escapeHtml(state.profile.reportEmail || '')}"
        placeholder="Recipient email" oninput="App.onProfileReportEmail(this.value)" style="margin-bottom:8px;" />
      <button class="modal-close" onclick="App.sendReport()">✉ Send my report</button>

      <label class="field-label">${IS_NATIVE_APP ? 'Sign in with Apple' : 'Sign in with Google'}</label>
      ${(googleUser || state.profile.hasUsernameAuth) ? `
        <div class="modal-sub" style="margin-bottom:8px;">${googleUser ? `Signed in as ${escapeHtml(googleUser.name || googleUser.email || 'your account')}` : `Username: ${escapeHtml(state.profile.username)}`}</div>
        <button class="modal-close" onclick="App.signOutGoogle()">Sign out</button>
      ` : IS_NATIVE_APP ? `
        <button class="modal-close" onclick="App.nativeAppleSignIn()" style="display:flex;align-items:center;justify-content:center;gap:8px;">${APPLE_LOGO_SVG}Sign in with Apple</button>
      ` : !GOOGLE_CONFIGURED ? `
      ` : `
        <div id="googleSignInBtn"></div>
      `}

      <button class="modal-close" onclick="App.hideProfile()">Close</button>
    `;
  }

  function renderDashboardHtml(){
    const pts = totalPoints();
    const level = levelFor(pts);
    const best = bestStreakEver();
    const daysPracticed = totalDaysPracticed();
    const t = todayStr();
    const todayTotal = activeNiyamsFor(t).length;
    const todayDone = doneCount(t);
    const todayPct = todayTotal ? Math.round((todayDone / todayTotal) * 100) : 0;

    const isMonth = dashboardPeriod === 'month';
    const periodRange = isMonth
      ? { start: monthStartKey(), end: todayStr(), label: new Date().toLocaleDateString(undefined, { month:'long' }) }
      : { start: yearStartKey(), end: todayStr(), label: String(new Date().getFullYear()) };
    const period = periodStats(periodRange.start, periodRange.end);

    let heat = '';
    for(let i=29;i>=0;i--){
      const d = new Date(); d.setDate(d.getDate()-i);
      const key = keyFor(d);
      const total = activeNiyamsFor(key).length;
      const done = doneCount(key);
      const cls = !total || done===0 ? '' : (done>=total ? 'hfull' : 'hpartial');
      heat += `<div class="heat-cell ${cls}" title="${key}: ${done}/${total}"></div>`;
    }

    const niyamRows = niyamSummaries().map(s => `
      <div class="bar-row">
        <span class="bar-label" title="${escapeHtml(s.name)}">${escapeHtml(s.name)}</span>
        <div class="bar-track"><div class="bar-fill" style="width:${s.pct}%;"></div></div>
        <span class="bar-pct">${s.pct}%</span>
      </div>`
    ).join('') || `<div style="color:var(--muted);font-size:12px;">No niyams yet — add one from the main screen.</div>`;

    const periodTotalsHtml = niyamPeriodTotals(periodRange.start, periodRange.end).map(p => {
      const valueText = p.unit === 'check'
        ? `${p.daysDone}/${p.daysInRange} days`
        : `${p.total}${p.unit === 'min' ? ' min' : ''}`;
      return `<div class="history-row"><span>${escapeHtml(p.name)}</span><span class="hcount">${valueText}</span></div>`;
    }).join('') || `<div style="color:var(--muted);font-size:12px;">No niyams logged yet.</div>`;

    return `
      <h2>Dashboard</h2>

      <div class="ring-wrap">
        <div class="ring" style="--pct:${todayPct};">
          <div class="ring-inner">
            <div class="rnum">${todayPct}%</div>
            <div class="rlabel">TODAY</div>
          </div>
        </div>
      </div>

      <div class="profile-stats">
        <div class="pstat"><div class="pnum" style="font-size:15px;">${levelLabel(level)}</div><div class="plabel">Level</div></div>
        ${state.profile.hidePoints ? '' : `<div class="pstat"><div class="pnum">${pts}</div><div class="plabel">Total points</div></div>`}
        <div class="pstat"><div class="pnum">${best}</div><div class="plabel">Best streak</div></div>
        <div class="pstat"><div class="pnum">${daysPracticed}</div><div class="plabel">Days practiced</div></div>
      </div>

      <div class="period-toggle">
        <button class="${isMonth ? 'active' : ''}" onclick="App.setDashboardPeriod('month')">Month to date</button>
        <button class="${!isMonth ? 'active' : ''}" onclick="App.setDashboardPeriod('year')">Year to date</button>
      </div>
      <div class="period-stats">
        <div class="period-stat"><div class="pnum">${period.days}</div><div class="plabel">Days practiced — ${periodRange.label}</div></div>
      </div>
      <label class="field-label">Logged — ${periodRange.label}</label>
      <div class="history-list" style="margin-bottom:16px;">
        ${periodTotalsHtml}
      </div>

      <label class="field-label">Last 30 days</label>
      <div class="heat-grid">${heat}</div>

      <label class="field-label">Per-niyam completion</label>
      ${niyamRows}

      <button class="modal-close" onclick="App.hideDashboard()">Close</button>
    `;
  }

  function renderManageHtml(){
    let body;
    if(manageLoading){
      body = `<div style="text-align:center;color:var(--muted);padding:24px 0;font-size:12px;">Loading…</div>`;
    } else if(manageEntries === null){
      body = `<div style="color:var(--muted);font-size:12.5px;line-height:1.5;">Couldn't reach the leaderboard — check your connection and reopen this screen.</div>`;
    } else if(!manageEntries.length){
      body = `<div style="color:var(--muted);font-size:12.5px;">No entries yet.</div>`;
    } else {
      const { duplicateUids } = findDuplicateUids(manageEntries);
      body = `<div class="lb-list">` + manageEntries.map(e => {
        const isBlocked = manageBlockedUids.includes(e.uid);
        const isDup = duplicateUids.has(e.uid);
        const place = e.state ? e.state : (e.country || '—');
        const updated = e.updatedAt ? new Date(e.updatedAt).toLocaleDateString(undefined, { month:'short', day:'numeric' }) : '—';
        const shortUid = e.uid ? e.uid.slice(-6) : '—';
        return `
          <div class="level-row" style="cursor:pointer;${isBlocked ? 'opacity:0.5;border-color:var(--muted);' : ''}${isDup && !isBlocked ? 'border-color:var(--gold);' : ''}" onclick="App.toggleManageBlock('${e.uid}')">
            <div style="flex:1;min-width:0;">
              <div class="lname" style="font-size:14px;${isBlocked ? 'text-decoration:line-through;' : ''}">${escapeHtml(e.name || 'Anonymous')}${isDup ? ' <span style="color:var(--gold);font-size:11px;">⚠ possible duplicate</span>' : ''}</div>
              <div class="lpts" style="margin-top:2px;">${place} · ${e.points || 0} pts · id …${shortUid} · updated ${updated}</div>
            </div>
            <div class="check" style="${isBlocked ? 'background:var(--muted);border-color:var(--muted);color:var(--bg);' : ''}">${isBlocked ? '✕' : ''}</div>
          </div>`;
      }).join('') + `</div>`;
    }
    return `
      <h2>Manage Leaderboard</h2>
      ${body}
      <button class="modal-close" style="margin-top:12px;" ${manageSaving ? 'disabled' : ''} onclick="App.saveManageChanges()">${manageSaving ? 'Saving…' : 'Save changes'}</button>
      <button class="modal-close" style="margin-top:8px;" onclick="App.hideManageLeaderboard()">Close without saving</button>
    `;
  }

  function renderLeaderboardHtml(){
    const uid = state.profile.uid;
    let body;
    if(leaderboardLoading){
      body = `<div style="text-align:center;color:var(--muted);padding:24px 0;font-size:12px;">Loading…</div>`;
    } else if(leaderboardEntries === null){
      body = `<div style="color:var(--muted);font-size:12.5px;line-height:1.5;">Couldn't reach the leaderboard — check your connection and tap Refresh below.</div>`;
    } else if(!leaderboardEntries.length){
      body = `<div style="color:var(--muted);font-size:12.5px;">No one on the leaderboard yet — be the first.</div>`;
    } else {
      body = `<div class="lb-list">` + leaderboardEntries.map((e, i) => {
        const isMe = e.uid === uid;
        const place = e.state ? `${e.state}` : (e.country || '—');
        return `
          <div class="lb-row ${isMe ? 'me' : ''}">
            <span class="lb-rank">${i+1}</span>
            <span class="lb-name">${escapeHtml(e.name || 'Anonymous')}${isMe ? ' (you)' : ''}</span>
            <span class="lb-state">${escapeHtml(place)}</span>
            <span class="lb-pts">${e.points || 0}</span>
          </div>`;
      }).join('') + `</div>`;
    }
    return `
      <h2 onclick="App.onLeaderboardTitleTap()" style="cursor:pointer;">Leaderboard</h2>
      ${body}
      <button class="modal-close" onclick="App.refreshLeaderboard()">Refresh</button>
      ${isAdmin ? `<button class="modal-close" style="margin-top:8px;" onclick="App.showManageLeaderboard()">Manage leaderboard…</button>` : ''}
      <button class="modal-close" style="margin-top:8px;" onclick="App.hideLeaderboard()">Close</button>
    `;
  }

  window.App = {
    toggleCheck,
    switchDayTab,
    onToggleFasting,
    onFastingTypeChange,
    onNoteInput,
    remove: removeNiyam,
    onPresetChange: onPresetSelectChange,
    addCustom: addCustomNiyam,
    toggleCustomTarget: (unit) => {
      const t = document.getElementById('customTargetField');
      if(t) t.style.display = unit === 'check' ? 'none' : 'block';
    },
    toggleEditTarget,
    toggleEditEnd,
    setTarget,
    setEndDate,
    clearEndDate,
    setActual,
    cancelAdd: cancelAddNiyam,
    nav: navDate,
    today: jumpToday,
    selectDay,
    resetAll,
    showLevels: () => { showLevelModal = true; pushModalHistory(); render(); },
    hideLevels: () => { showLevelModal = false; popModalHistoryIfNeeded(); render(); },
    showProfile: () => { showProfileModal = true; pushModalHistory(); render(); },
    hideProfile: () => { showProfileModal = false; popModalHistoryIfNeeded(); render(); },
    showDashboard: () => { showDashboardModal = true; pushModalHistory(); render(); },
    hideDashboard: () => { showDashboardModal = false; popModalHistoryIfNeeded(); render(); },
    setDashboardPeriod: (p) => { dashboardPeriod = p; render(); },
    onProfileName: onProfileNameInput,
    onProfileHidePoints: onProfileHidePointsToggle,
    onProfileLeaderboardOptIn: onProfileLeaderboardOptInToggle,
    onProfileTheme: onProfileThemeToggle,
    onProfileCountry: onProfileCountryInput,
    onProfileState: onProfileStateInput,
    onProfileIntention: onProfileIntentionInput,
    onProfileReportEmail: onProfileReportEmailInput,
    sendReport,
    onOnboardName: onOnboardNameInput,
    onOnboardUsername: onOnboardUsernameInput,
    onOnboardPassword: onOnboardPasswordInput,
    onOnboardConfirmPassword: onOnboardConfirmPasswordInput,
    switchOnboardMode,
    onSecureUsername: onSecureUsernameInput,
    onSecurePassword: onSecurePasswordInput,
    onSecureConfirmPassword: onSecureConfirmPasswordInput,
    submitSecureAccount,
    dismissSecureAccountPrompt,
    openSecureAccountModal,
    onOnboardCountry: onOnboardCountryInput,
    onOnboardState: onOnboardStateInput,
    submitOnboarding,
    showLeaderboard: openLeaderboard,
    hideLeaderboard: () => { showLeaderboardModal = false; popModalHistoryIfNeeded(); render(); },
    refreshLeaderboard,
    showManageLeaderboard: openManageLeaderboard,
    hideManageLeaderboard: () => { showManageModal = false; popModalHistoryIfNeeded(); render(); },
    toggleManageBlock,
    saveManageChanges,
    onLeaderboardTitleTap,
    signOutGoogle,
    nativeAppleSignIn,
    handleNativeAppleCredential,
    nativeGoogleSignIn,
    handleNativeGoogleCredential,
    onGoogleLibraryLoad: () => { initGoogleSignIn(); renderGoogleButtonIfNeeded(); }
  };

  loadAdminFlag();
  loadState();
  setInterval(checkDayRollover, 30000);
})();
</script>
</body>
</html>
