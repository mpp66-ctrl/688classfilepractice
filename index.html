<style>
  :root{
    --bg: #0B1C3D;
    --panel: #12274F;
    --line: #223A6B;
    --gold: #FF9933;
    --green: #128807;
    --cream: #FDF8EF;
    --muted: #93A3C7;
    --font-display: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --font-mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    background:
      url("data:image/svg+xml,<svg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'><defs><path%20id='petalOuter'%20d='M50%2050%20Q44.0%2018.0%2050%2012.0%20Q56.0%2018.0%2050%2050%20Z'/><path%20id='petalInner'%20d='M50%2050%20Q46.0%2031.0%2050%2027.0%20Q54.0%2031.0%2050%2050%20Z'/></defs><g%20fill='none'%20stroke='%23FF9933'%20stroke-width='0.9'%20opacity='0.55'><use%20href='#petalOuter'%20transform='rotate(0%2050%2050)'/><use%20href='#petalOuter'%20transform='rotate(30%2050%2050)'/><use%20href='#petalOuter'%20transform='rotate(60%2050%2050)'/><use%20href='#petalOuter'%20transform='rotate(90%2050%2050)'/><use%20href='#petalOuter'%20transform='rotate(120%2050%2050)'/><use%20href='#petalOuter'%20transform='rotate(150%2050%2050)'/><use%20href='#petalOuter'%20transform='rotate(180%2050%2050)'/><use%20href='#petalOuter'%20transform='rotate(210%2050%2050)'/><use%20href='#petalOuter'%20transform='rotate(240%2050%2050)'/><use%20href='#petalOuter'%20transform='rotate(270%2050%2050)'/><use%20href='#petalOuter'%20transform='rotate(300%2050%2050)'/><use%20href='#petalOuter'%20transform='rotate(330%2050%2050)'/></g><g%20fill='none'%20stroke='%23FF9933'%20stroke-width='0.8'%20opacity='0.4'><use%20href='#petalInner'%20transform='rotate(15%2050%2050)'/><use%20href='#petalInner'%20transform='rotate(45%2050%2050)'/><use%20href='#petalInner'%20transform='rotate(75%2050%2050)'/><use%20href='#petalInner'%20transform='rotate(105%2050%2050)'/><use%20href='#petalInner'%20transform='rotate(135%2050%2050)'/><use%20href='#petalInner'%20transform='rotate(165%2050%2050)'/><use%20href='#petalInner'%20transform='rotate(195%2050%2050)'/><use%20href='#petalInner'%20transform='rotate(225%2050%2050)'/><use%20href='#petalInner'%20transform='rotate(255%2050%2050)'/><use%20href='#petalInner'%20transform='rotate(285%2050%2050)'/><use%20href='#petalInner'%20transform='rotate(315%2050%2050)'/><use%20href='#petalInner'%20transform='rotate(345%2050%2050)'/></g><circle%20cx='50'%20cy='50'%20r='44'%20fill='none'%20stroke='%23FF9933'%20stroke-width='0.5'%20opacity='0.3'/><circle%20cx='50'%20cy='50'%20r='6'%20fill='none'%20stroke='%23FF9933'%20stroke-width='0.9'%20opacity='0.5'/><text%20x='50'%20y='54'%20font-size='8'%20text-anchor='middle'%20fill='%23FF9933'%20opacity='0.55'%20font-family='serif'>%E0%A5%90</text></svg>"),
      radial-gradient(ellipse at 50% 0%, rgba(255,153,51,0.10) 0%, transparent 60%),
      radial-gradient(ellipse at 50% 100%, rgba(18,136,7,0.08) 0%, transparent 60%),
      var(--bg);
    background-repeat: no-repeat, no-repeat, no-repeat, no-repeat;
    background-position: center 50vh, 0 0, 0 0, 0 0;
    background-attachment: fixed, fixed, fixed, fixed;
    background-size: min(340px, 52vh) min(340px, 52vh), 100% 100vh, 100% 100vh, auto;
    color: var(--cream);
    font-family: var(--font-body);
    min-height: 100vh;
    padding: 24px 16px 50px;
  }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }
  .wrap{
    max-width: 480px; margin: 0 auto;
    padding-top: max(16px, env(safe-area-inset-top));
    padding-bottom: max(16px, env(safe-area-inset-bottom));
    padding-left: max(0px, env(safe-area-inset-left));
    padding-right: max(0px, env(safe-area-inset-right));
    box-sizing: border-box;
  }

  header{ text-align:center; margin-bottom: 20px; }
  .header-row{ display:flex; align-items:center; gap:8px; }
  .header-row h1{ margin:4px 0; }
  .profile-btn{
    background: rgba(255,255,255,0.06); border:1px solid var(--line); color: var(--cream);
    width:34px; height:34px; border-radius:50%; font-size:15px; cursor:pointer; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .profile-btn:hover{ border-color: var(--gold); }
  h1{ font-family: var(--font-display); font-weight:400; font-size: 28px; margin: 4px 0; color: var(--gold); }
  .subtitle{ color: var(--muted); font-size: 13px; }

  .mantras{ text-align:center; margin: 18px 0 22px; padding: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 8px 24px rgba(0,0,0,0.25); }
  .mantras div{ font-family: var(--font-display); font-size: 15px; margin: 4px 0; }
  .mantras .om{ color: var(--gold); display:inline-block; animation: pulse 3.5s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ opacity:1; transform: scale(1); } 50%{ opacity:0.75; transform: scale(1.08); } }

  /* Date navigation */
  .date-nav{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 10px 12px; margin-bottom: 14px;
  }
  .date-nav button{
    background: rgba(255,255,255,0.06); border: 1px solid var(--line); color: var(--cream);
    width: 34px; height:34px; border-radius: 9px; font-size: 15px; cursor:pointer;
    flex-shrink:0; display:flex; align-items:center; justify-content:center;
  }
  .date-nav button:disabled{ opacity:0.3; cursor:default; }
  .date-nav button:hover:not(:disabled){ border-color: var(--gold); }
  .date-label{ text-align:center; flex:1; }
  .date-label .d1{ font-family: var(--font-display); font-size: 16px; color: var(--gold); }
  .date-label .d2{ font-size: 11px; color: var(--muted); font-family: var(--font-mono); }
  .today-jump{ font-size: 10px; color: var(--gold); text-decoration: underline; cursor:pointer; margin-top:2px; display:inline-block; }

  .status{
    display:flex; align-items:center; justify-content:space-between;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px; margin-bottom: 20px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    transition: box-shadow 0.4s ease, border-color 0.4s ease;
  }
  .status.complete{ border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold), 0 8px 28px rgba(255,153,51,0.25); }
  .status .level{ font-family: var(--font-display); font-size: 18px; color: var(--gold); }
  .status .pts{ font-family: var(--font-mono); font-size: 12px; color: var(--muted); margin-top:2px; }
  .status .streak{ text-align:right; font-size: 15px; }
  .status .streak .n{ font-family: var(--font-mono); font-weight:700; color: var(--green); }
  .status .streak.lit{ animation: flicker 1.6s ease-in-out infinite; }
  @keyframes flicker{ 0%,100%{ opacity:1; } 50%{ opacity:0.8; } }

  .section-title{ font-family: var(--font-display); font-size: 17px; margin: 22px 0 10px 2px; display:flex; align-items:baseline; justify-content:space-between; }
  .section-title .viewing{ font-size: 11px; color: var(--muted); font-family: var(--font-mono); font-weight:normal; }

  .niyam-list{ display:flex; flex-direction:column; gap: 8px; }
  .niyam-item{
    display:flex; align-items:center; gap: 12px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 14px;
    transition: border-color 0.2s ease, background 0.2s ease;
  }
  .niyam-item.done{ border-color: var(--gold); background: linear-gradient(90deg, rgba(255,153,51,0.12), var(--panel)); }
  .niyam-item{ flex-direction: column; align-items: stretch; }
  .niyam-row{ display:flex; align-items:center; gap: 12px; }
  .niyam-target{ cursor:pointer; }
  .niyam-target:hover{ color: var(--gold); }
  .target-edit{ margin: 10px 0 2px 34px; }
  .check{
    width: 22px; height:22px; border-radius:50%; flex-shrink:0;
    border: 2px solid var(--muted); display:flex; align-items:center; justify-content:center;
    font-size: 12px; color: transparent; cursor:pointer;
    transition: transform 0.25s cubic-bezier(.34,1.56,.64,1), background 0.2s ease, border-color 0.2s ease;
  }
  .niyam-item.done .check{ background: var(--gold); border-color: var(--gold); color: var(--bg); transform: scale(1.12); }
  .niyam-main{ flex:1; min-width:0; }
  .niyam-name{ font-size: 14.5px; }
  .niyam-item.done .niyam-name{ color: var(--gold); }
  .niyam-target{ font-size: 10.5px; color: var(--muted); font-family: var(--font-mono); margin-top:1px; }
  .niyam-start{ font-size: 9.5px; color: var(--muted); font-family: var(--font-mono); margin-top:1px; opacity:0.75; }
  .niyam-row{ flex-wrap:wrap; }
  .amount-control{ margin: 8px 0 2px 34px; }

  .amount-control{ display:flex; align-items:center; gap:6px; flex-shrink:0; }
  .amount-control input{
    width: 64px; background: rgba(255,255,255,0.06); border: 1px solid var(--line); border-radius: 8px;
    padding: 7px 8px; color: var(--cream); font-size: 13.5px; font-family: var(--font-mono); text-align:right;
  }
  .amount-control input:focus{ outline: none; border-color: var(--gold); }
  .amount-control .unit{ font-size: 10.5px; color: var(--muted); width: auto; white-space:nowrap; }

  .niyam-del{ background:none; border:none; color: var(--muted); font-size: 15px; cursor:pointer; opacity: 0.5; padding: 2px 4px; flex-shrink:0; }
  .niyam-del:hover{ opacity:1; }

  .add-niyam{ margin-top: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  .add-niyam select{
    width:100%; background: rgba(255,255,255,0.06); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; color: var(--cream); font-size: 13.5px; font-family: var(--font-body);
  }
  .add-niyam select:focus{ outline: 1px solid var(--gold); border-color: var(--gold); }
  .custom-form{ margin-top: 10px; display:flex; flex-direction:column; gap:8px; }
  .custom-form .row{ display:flex; gap:8px; }
  .custom-form input, .custom-form select{
    background: rgba(255,255,255,0.06); border: 1px solid var(--line); border-radius: 10px;
    padding: 9px 10px; color: var(--cream); font-size: 13px; font-family: var(--font-body); flex:1; min-width:0;
  }
  .custom-form button{ background: var(--gold); color: var(--bg); border:none; border-radius: 10px; padding: 0 16px; font-weight:600; cursor:pointer; font-size: 13px; }

  .status .level{ cursor:pointer; text-decoration: underline; text-decoration-color: transparent; transition: text-decoration-color 0.2s ease; }
  .status .level:hover{ text-decoration-color: var(--gold); }

  .modal-backdrop{
    position: fixed; inset:0; background: rgba(0,0,0,0.55); display:none;
    align-items:center; justify-content:center;
    padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
    box-sizing: border-box;
    z-index: 50;
  }
  .modal-backdrop.show{ display:flex; }
  .modal{
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px;

    max-height: 85vh; overflow-y: auto;
  }
  .modal h2{ font-family: var(--font-display); font-weight:400; color: var(--gold); font-size: 19px; margin: 0 0 4px; }
  .modal .modal-sub{ color: var(--muted); font-size: 12px; margin-bottom: 14px; }
  .level-list{ display:flex; flex-direction:column; gap: 8px; }
  .level-row{
    display:flex; align-items:center; justify-content:space-between;
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
  }
  .level-row.current{ border-color: var(--gold); background: rgba(255,153,51,0.12); }
  .level-row .lname{ font-family: var(--font-display); font-size: 15px; }

  .level-row .lpts{ font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
  .modal-close{ margin-top: 16px; width:100%; background: rgba(255,255,255,0.06); border: 1px solid var(--line); color: var(--cream); border-radius: 10px; padding: 10px; cursor:pointer; font-size: 13.5px; }

  .field-label{ font-size:11px; color:var(--muted); margin: 12px 0 4px; display:block; font-family: var(--font-mono); }

  .pstat{ background: rgba(255,255,255,0.04); border:1px solid var(--line); border-radius:10px; padding:9px 10px; text-align:center; }
  .pnum{ font-family: var(--font-display); color: var(--gold); font-size:15px; overflow-wrap:anywhere; }
  .plabel{ font-size:10px; color: var(--muted); margin-top:2px; }
  .history-list{ display:flex; flex-direction:column; gap:4px; max-height:170px; overflow-y:auto; margin-top:4px; }
  .history-row{ display:flex; justify-content:space-between; font-size:12px; padding:6px 9px; border-radius:8px; background: rgba(255,255,255,0.03); }
  .history-row.full{ background: rgba(255,153,51,0.14); color: var(--gold); }
  .hcount{ font-family: var(--font-mono); color: var(--muted); }
  .history-row.full .hcount{ color: var(--gold); }

  .heat-grid{ display:grid; grid-template-columns: repeat(10, 1fr); gap:4px; margin: 6px 0 14px; }
  .heat-cell{ aspect-ratio: 1; border-radius: 4px; background: rgba(255,255,255,0.06); border: 1px solid var(--line); }
  .heat-cell.hpartial{ background: rgba(255,153,51,0.35); border-color: var(--gold); }
  .heat-cell.hfull{ background: var(--gold); border-color: var(--gold); }

  .lb-list{ display:flex; flex-direction:column; gap:4px; max-height:260px; overflow-y:auto; margin-top:8px; }

  .ring-wrap{ display:flex; justify-content:center; margin: 6px 0 14px; }
  .ring{
    width: 116px; height: 116px; border-radius: 50%;
    display:flex; align-items:center; justify-content:center;
    background: conic-gradient(var(--gold) calc(var(--pct) * 1%), rgba(255,255,255,0.08) 0);
  }
  .ring-inner{
    width: 92px; height: 92px; border-radius: 50%; background: var(--bg);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    border: 1px solid var(--line);
  }
  .ring-inner .rnum{ font-family: var(--font-display); font-size: 24px; color: var(--gold); line-height:1; }
  .ring-inner .rlabel{ font-size: 9.5px; color: var(--muted); font-family: var(--font-mono); margin-top:3px; letter-spacing:0.03em; }

  .period-toggle{ display:flex; gap:6px; margin: 4px 0 10px; }
  .period-toggle button{
    flex:1; padding:8px; border-radius:8px; border:1px solid var(--line);
    background: rgba(255,255,255,0.04); color: var(--muted);
    font-family: var(--font-mono); font-size: 11.5px; letter-spacing:0.03em;
    cursor:pointer;
  }
  .period-toggle button.active{ background: var(--gold); color: var(--bg); border-color: var(--gold); font-weight:600; }

  .period-stats{ display:flex; gap:8px; margin-bottom: 14px; }

  .period-stat .pnum{ font-family: var(--font-display); font-size: 19px; color: var(--gold); }
  .period-stat .plabel{ font-size: 9.5px; color: var(--muted); font-family: var(--font-mono); margin-top:2px; }

  .bar-row{ display:flex; align-items:center; gap:8px; margin-bottom:9px; }
  .bar-row .bar-label{ width: 96px; font-size: 12px; flex-shrink:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bar-track{ flex:1; height: 9px; border-radius:5px; background: rgba(255,255,255,0.07); overflow:hidden; }
  .bar-fill{ height:100%; border-radius:5px; background: linear-gradient(90deg, var(--gold), #ffcf80); }
  .bar-pct{ width: 36px; text-align:right; font-size: 10.5px; color: var(--muted); font-family: var(--font-mono); flex-shrink:0; }
  .lb-row{
    display:grid; grid-template-columns: 22px 1fr 52px 46px; gap:6px; align-items:center;
    font-size:12px; padding:7px 9px; border-radius:8px; background: rgba(255,255,255,0.03);

  footer{ text-align:center; margin-top: 30px; }
  footer button{ background:none; border:none; color: var(--muted); text-decoration: underline; cursor:pointer; font-size: 11px; }

  /* Onboarding screen */
  .onboard{
    min-height: calc(100vh - 74px); display:flex; flex-direction:column; justify-content:center;
    align-items:center; text-align:center; padding: 20px 6px;
  }
  .onboard-card{
    width:100%; max-width: 400px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 18px; padding: 28px 22px; box-shadow: 0 12px 40px rgba(0,0,0,0.35);
    display:flex; flex-direction:column; align-items:center;
  }
  .onboard .om-big{ font-size: 40px; color: var(--gold); animation: pulse 3.5s ease-in-out infinite; margin-bottom: 6px; }
  .onboard h1{ margin: 0 0 6px; color: var(--gold); }
  .onboard .onboard-sub{ color: var(--muted); font-size: 13.5px; max-width: 320px; margin-bottom: 28px; line-height:1.5; }
  .onboard-google{ display:flex; flex-direction:column; align-items:center; gap:8px; margin-bottom: 22px; }
  .onboard-google-sub{ color: var(--muted); font-size: 11.5px; max-width: 280px; text-align:center; }
  .onboard-form{ width:100%; max-width: 340px; display:flex; flex-direction:column; gap:14px; text-align:left; }
  .onboard-form .field-label{ margin: 0 0 4px; }
  .onboard-btn{
    margin-top: 8px; width:100%; background: var(--gold); color: var(--bg); border:none;

  .slider-value-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom: 6px; }

  .target-input-row{ display:flex; gap:8px; margin-bottom:8px; }

  .target-input-row button{

    padding: 8px 14px; font-family: var(--font-mono); font-size: 12.5px; font-weight:600; cursor:pointer;
  }
  #customTargetField input[type="number"]{
    width:100%; margin-bottom:8px; background: rgba(255,255,255,0.06); border:1px solid var(--line);
    border-radius:8px; color: var(--cream); font-family: var(--font-mono); font-size: 15px; padding: 8px 10px;
  }

  .toast{
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px);
    background: var(--gold); color: var(--bg); padding: 9px 16px; border-radius: 30px;
    font-size: 13px; font-weight: 600; opacity: 0; transition: all 0.3s ease; pointer-events:none;
  }
  .toast.show{ opacity: 1; transform: translateX(-50%) translateY(0); }
  .loading{ text-align:center; padding: 60px 0; color: var(--muted); font-family: var(--font-mono); font-size: 12px; }

  /* --- Persistent OMY watermark, shown behind the whole screen on every page --- */
  .omy-watermark{
    position: fixed;
    inset: 0;
    z-index: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    user-select: none;
    overflow: hidden;
  }
  .omy-watermark img{
    width: min(70vw, 420px);
    height: auto;
    opacity: 0.10;
  }
  html[data-theme="light"] .omy-watermark img{ opacity: 0.12; }
  /* Everything else needs to sit above the watermark layer */
  #app{ position: relative; z-index: 1; }

  #fireworks-canvas{ z-index: 3; }

  /* --- Light mode --- */
  html[data-theme="light"]{

    --cream: #1B2A4A;
    --muted: #6B7690;
  }
  html[data-theme="light"] body{
    background-color: var(--bg);
  }

<script>
(function(){
  const KEY = 'niyam-tracker-v2';
  const todayStr = () => keyFor(new Date());

  function keyFor(d){
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  function parseKey(k){
    const [y,m,d] = k.split('-').map(Number);
    return new Date(y, m-1, d);
  }

  // unit: 'count' | 'min' | 'check'
  const PRESETS = [
    { name:'Varad Hasta', unit:'count', target:11 },
    { name:'Pranam', unit:'count', target:51 },
    { name:'Jap', unit:'count', target:5000 },
    { name:'Reading', unit:'min', target:60 },
    { name:'Walking', unit:'min', target:30 },
    { name:'Maun / Silence', unit:'min', target:300 },
    { name:'Prathna', unit:'min', target:15 },
    { name:'Tu Tane Mal / Meditation', unit:'min', target:30 },
    { name:'Writing / Journal', unit:'check', target:1 },
  ];

  function defaultNiyams(){
    return [];
  }

  const LEVELS = [
    { name:'Arambhak', min:0, num:1 },
    { name:'Sadhak', min:1000, num:2 },
    { name:'Nishtha', min:3000, num:3 },
    { name:'Tapasvi', min:6000, num:4 },
    { name:'Avirat', min:12000, num:5 },
  ];

  const US_STATES = [
    "Alabama","Alaska","Arizona","Arkansas","California","Colorado","Connecticut","Delaware",
    "Florida","Georgia","Hawaii","Idaho","Illinois","Indiana","Iowa","Kansas","Kentucky",
    "Louisiana","Maine","Maryland","Massachusetts","Michigan","Minnesota","Mississippi","Missouri",
    "Montana","Nebraska","Nevada","New Hampshire","New Jersey","New Mexico","New York",
    "North Carolina","North Dakota","Ohio","Oklahoma","Oregon","Pennsylvania","Rhode Island",
    "South Carolina","South Dakota","Tennessee","Texas","Utah","Vermont","Virginia","Washington",
    "West Virginia","Wisconsin","Wyoming","District of Columbia"
  ];

  // Only the United States gets a state dropdown; other countries just
  // use the country name itself for the leaderboard/profile location.
  const COUNTRIES = [
    "United States","Canada","Australia","India","Panama","England","South Africa","New Zealand"
  ];

  let state = null;
  let saveTimer = null;
  let selectedDate = new Date();
  let showCustomForm = false;
  let activeDayTab = 'niyams'; // 'niyams' | 'fasting' — which panel shows below the day header
  let draftNiyam = { name:'', unit:'count', target:1, startDate:'' };
  let showLevelModal = false;
  let showProfileModal = false;
  let showLeaderboardModal = false;
  let showDashboardModal = false;
  let dashboardPeriod = 'month'; // 'month' | 'year' — toggled from the dashboard
  let leaderboardEntries = null;
  let leaderboardLoading = false;
  // Signature of the last stats we actually pushed to the shared leaderboard
  // (points/streak/level/name/etc). Every saveState() call used to trigger a
  // full read-modify-write of the shared record regardless of whether
  // anything leaderboard-relevant changed — with many people using the app,
  // that's a lot of concurrent writes racing each other, which is how an
  // admin's "remove from leaderboard" can get clobbered by someone else's
  // unrelated score sync landing a moment later. Skipping no-op pushes
  // cuts that collision risk down substantially.
  let lastPushedSignature = null;
  let showManageModal = false;
  let showSecureAccountModal = false;
  const secureAccountDraft = { username:'', password:'', confirmPassword:'' };
  let secureAccountError = '';
  let secureAccountBusy = false;

  // googleUser is used for BOTH Google and Apple sign-in (Apple's sub is
  // stored prefixed as "apple_..."), so this checks specifically for a
  // real Google-authenticated session — the only case exempt from being
  // forced to also set a username/password, since Google's own sign-in
  // already provides account recovery on its own.
  function isGoogleAuthed(){
    return !!(googleUser && !String(googleUser.sub).startsWith('apple_'));
  }

  // True whenever this account MUST set a username/password before
  // continuing to use the app: already onboarded, doesn't have one yet,
  // and isn't exempt via real Google sign-in. Apple sign-in and
  // local/manual accounts are not exempt — Apple's own account recovery
  // isn't wired into this app the way Google's is, so it doesn't get a
  // pass here.
  function needsForcedPassword(){
    return state.profile.onboarded && !state.profile.hasUsernameAuth && !isGoogleAuthed();
  }

  function onSecureUsernameInput(v){ secureAccountDraft.username = v; }
  function onSecurePasswordInput(v){ secureAccountDraft.password = v; }
  function onSecureConfirmPasswordInput(v){ secureAccountDraft.confirmPassword = v; }

  function dismissSecureAccountPrompt(){
    // Only actually closeable if this account is exempt (shouldn't ever
    // be open in that case anyway) — otherwise this is a no-op with a
    // reminder toast, since setting a password isn't optional here.
    if(needsForcedPassword()){
      showToast('Please create a username and password to continue');
      return;
    }
    showSecureAccountModal = false;
    state.profile.passwordPromptDismissed = true;
    saveState();
    render();
  }

  function openSecureAccountModal(){
    secureAccountError = '';
    secureAccountDraft.username = '';
    secureAccountDraft.password = '';
    secureAccountDraft.confirmPassword = '';
    showSecureAccountModal = true;
    render();
  }

  async function submitSecureAccount(){
    if(secureAccountBusy) return;
    secureAccountError = '';
    secureAccountBusy = true;
    render();
    const result = await signUpWithUsername(secureAccountDraft.username, secureAccountDraft.password, secureAccountDraft.confirmPassword);
    secureAccountBusy = false;
    if(!result.ok){
      secureAccountError = result.error;
      render();
      return;
    }
    showSecureAccountModal = false;
    showToast('Account secured — you can now recover it on any device');
    render();

  // whenever a niyam is toggled, and letting whichever side touched that

  // Call this at the start of any function that edits state.profile, so
  // mergeProfile() above can correctly tell which device's copy of the
  // profile is actually the most recent one.
  // --- Fasting (occasional, not a daily niyam — never affects streaks/points) ---
  function switchDayTab(tab){
    activeDayTab = (tab === 'fasting') ? 'fasting' : 'niyams';
    render();
  }

  function onToggleFasting(){
    const t = selectedKey();
    const cur = state.fasting[t];
    const wasFasted = !!(cur && cur.fasted);
    state.fasting[t] = { fasted: !wasFasted, type: (cur && cur.type) || 'full', __t: Date.now() };
    saveState();
    render();
  }

  function onFastingTypeChange(type){
    const t = selectedKey();
    const cur = state.fasting[t] || { fasted: true };
    state.fasting[t] = { fasted: true, type, __t: Date.now() };
    saveState();
    render();
  }

  function totalFastingDays(){
    return Object.values(state.fasting || {}).filter(f => f && f.fasted).length;
  }

  // --- Freeform notes, one per day, shown at the bottom of every day page ---
  function onNoteInput(value){
    const t = selectedKey();
    state.notes[t] = { text: value, __t: Date.now() };
    saveState();
  }

  function touchProfile(){
    state.profile.updatedAt = Date.now();
  }

  // BUG FIX (round 2): the previous version swapped the WHOLE profile
  // object based on a single timestamp — "whichever side was edited most
  // recently wins entirely." That fixed the original leaderboard-toggle
  // bug, but broke something else: a freshly-loaded device's blank
  // profile (with a brand new, always-newer updatedAt) would completely
  // overwrite the remote profile's real name/state on every sign-in, and
  // could flip hasUsernameAuth back to false, making "secure your
  // account" seem to never actually save. Fixed with a field-by-field
  // merge using the right strategy per field:
  //   - text/identity fields (name, state, etc.): prefer whichever side
  //     actually has a value — a blank never overwrites real data.
  //   - toggle fields where "off" is a real, meaningful choice
  //     (leaderboardOptIn, hidePoints, theme): true last-write-wins,
  //     using the timestamp.
  //   - sticky fields with no "undo" in the app (onboarded,
  //     hasUsernameAuth): once true anywhere, stays true everywhere —
  //     a stale merge can never revert them back to false.
  function mergeProfile(localP, remoteP){
    const l = localP || {}, r = remoteP || {};
    const lt = l.updatedAt || 0, rt = r.updatedAt || 0;
    const lwwSource = (lt >= rt) ? l : r;

    const out = {};

    const textFields = ['name','country','state','intention','reportEmail','joinDate','uid','legacyUid','username'];
    textFields.forEach(k => {
      const lv = l[k], rv = r[k];
      if(lv !== undefined && lv !== '' && lv !== null) out[k] = lv;
      else if(rv !== undefined && rv !== '' && rv !== null) out[k] = rv;
      else out[k] = (lv !== undefined ? lv : rv);
    });

    const lwwFields = ['leaderboardOptIn','hidePoints','theme','passwordPromptDismissed'];
    lwwFields.forEach(k => { out[k] = lwwSource[k]; });

    out.onboarded = !!(l.onboarded || r.onboarded);
    out.hasUsernameAuth = !!(l.hasUsernameAuth || r.hasUsernameAuth);
    out.updatedAt = Math.max(lt, rt) || Date.now();

    // Anything else not explicitly handled above: same "prefer
    // non-empty" rule as the text fields.
    const known = new Set([...textFields, ...lwwFields, 'onboarded', 'hasUsernameAuth', 'updatedAt']);
    const allKeys = new Set([...Object.keys(l), ...Object.keys(r)]);
    allKeys.forEach(k => {
      if(known.has(k)) return;
      const lv = l[k], rv = r[k];
      if(lv !== undefined && lv !== '' && lv !== null) out[k] = lv;
      else out[k] = rv;
    });

    return out;
  }

  // Simple "whichever day was touched most recently wins" merge, used for
  // fasting and notes — both are small, occasional, per-date records where
  // each entry carries its own __t timestamp, so no legacy fallback is
  // needed the way mergeCheckins has one.
  function mergeByDateNewest(localObj, remoteObj){
    const merged = {};
    const dates = new Set([...Object.keys(localObj||{}), ...Object.keys(remoteObj||{})]);
    dates.forEach(d => {
      const l = localObj && localObj[d];
      const r = remoteObj && remoteObj[d];
      if(l === undefined){ merged[d] = r; return; }
      if(r === undefined){ merged[d] = l; return; }
      const lt = (l && l.__t) || 0, rt = (r && r.__t) || 0;
      merged[d] = lt >= rt ? l : r;
    });
    return merged;
  }

  function mergeStates(local, remote){
    if(!remote) return local;
    if(!local) return remote;
    return {
      niyams: mergeNiyams(local.niyams, remote.niyams),
      checkins: mergeCheckins(local.checkins, remote.checkins),
      fasting: mergeByDateNewest(local.fasting, remote.fasting),
      notes: mergeByDateNewest(local.notes, remote.notes),
      profile: mergeProfile(local.profile, remote.profile)
    };
  }

  async function loadState(){
    const raw = await safeStorageGet(KEY);
    try{
      state = raw ? JSON.parse(raw) : defaultState();
    } catch(e){
      state = defaultState();
    }
    state.niyams = state.niyams || defaultNiyams();
    state.checkins = state.checkins || {};
    state.fasting = state.fasting || {};
    state.notes = state.notes || {};
    state.profile = state.profile || { name:'', country:'United States', state:'', intention:'', reportEmail:'', joinDate: todayStr(), uid:'', onboarded:false };
    if(!state.profile.joinDate) state.profile.joinDate = todayStr();
    if(state.profile.state === undefined) state.profile.state = '';
    if(!state.profile.country) state.profile.country = 'United States';
    if(state.profile.reportEmail === undefined) state.profile.reportEmail = '';
    if(!state.profile.uid) state.profile.uid = 'u' + Math.random().toString(36).slice(2) + Date.now().toString(36);
    if(state.profile.hidePoints === undefined) state.profile.hidePoints = false;
    // New field. Brand-new profiles (created via defaultState()) already
    // start with leaderboardOptIn:false — opted OUT by default. Anyone
    // whose profile predates this field was already effectively publishing
    // to the leaderboard with no opt-out available, so treat "missing" as
    // "already opted in" rather than silently removing existing users.
    if(state.profile.leaderboardOptIn === undefined) state.profile.leaderboardOptIn = true;
    if(!state.profile.theme) state.profile.theme = 'dark';
    if(state.profile.username === undefined) state.profile.username = '';
    if(state.profile.hasUsernameAuth === undefined) state.profile.hasUsernameAuth = false;
    if(state.profile.passwordPromptDismissed === undefined) state.profile.passwordPromptDismissed = false;
    applyTheme();
    if(state.profile.onboarded === undefined){
      // Existing users who already had a name/state saved shouldn't be
      // forced through onboarding again.
      state.profile.onboarded = !!(state.profile.name && state.profile.state);
    }
    onboardDraft.name = state.profile.name || '';
    onboardDraft.country = state.profile.country || 'United States';
    onboardDraft.state = state.profile.state || '';
    googleUser = loadGoogleUserFromLocal();
    render();
    syncNativeNotification();
    syncSpecialDayNotifications();
    if(googleUser){
      // Already signed in on this device from a previous session — pull
      // the cloud copy and merge it in, so anything added on another
      // phone since this device last opened shows up here too.
      const remote = await pullGoogleUserData(googleUser.sub);
      if(remote){
        state = mergeStates(state, remote);
        applyStableGoogleUid();
        await safeStorageSet(KEY, JSON.stringify(state));
        render();
      } else {
        applyStableGoogleUid();
      }
      pushGoogleUserData();
    }

    // Existing account without a linked username/password. Mandatory for
    // everyone except real Google sign-ins (see needsForcedPassword) — a
    // past "Maybe later" dismissal no longer applies once this became
    // required, so it's intentionally not checked here anymore.
    if(needsForcedPassword()){
      showSecureAccountModal = true;
      render();
    }
  }

  function saveState(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => {
      const ok = await safeStorageSet(KEY, JSON.stringify(state));
      if(!ok && !warnedOnce){
        warnedOnce = true;
        showToast('Saved for this session only');
      }
      pushToLeaderboard();
      if(googleUser) pushGoogleUserData();
      else pushUsernameAuthData();
      syncNativeNotification();
    }, 250);
  }

  // Each sync does a GET-then-PUT round trip. If pushes overlap (e.g. a
  // few quick checks/unchecks), an older-but-slower one can finish AFTER a
  // newer one and overwrite it with stale points. Queuing them strictly
  // one-at-a-time guarantees the last one to run is always the last one
  // to actually happen, and it always reads points fresh at run time.
  let pushChain = Promise.resolve();

  function pushToLeaderboard(){
    pushChain = pushChain.then(() => doPushToLeaderboard()).catch(() => {});
    return pushChain;
  }

  let leaderboardSyncWarned = false;

  async function doPushToLeaderboard(){
    if(!firebaseReady) return;
    try{
      const pts = totalPoints();
      const level = levelFor(pts);
      const optedIn = !!state.profile.leaderboardOptIn;
      const signature = JSON.stringify({
        uid: state.profile.uid,
        optedIn,
        name: (state.profile.name || '').trim().slice(0,40) || 'Anonymous',
        state: state.profile.state || '',
        country: state.profile.country || '',
        points: pts,
        level: level.name,
        streak: overallStreak(),
        best: bestStreakEver(),
        niyams: niyamSummaries()
      });
      const hasLegacyCleanup = !!(state.profile.legacyUid && state.profile.legacyUid !== state.profile.uid);
      if(signature === lastPushedSignature && !hasLegacyCleanup){
        // Nothing leaderboard-relevant changed since our last successful
        // push — skip the write entirely.
        return;
      }

      const myName = (state.profile.name || '').trim().slice(0,40) || 'Anonymous';
      const myState = state.profile.state || '';
      const myCountry = state.profile.country || '';

      // Leaderboard visibility is opt-in (default off for new users). "Hide
      // my points" is a separate, unrelated toggle that only affects what's
      // shown on this person's own Profile screen. Each entry is its own
      // Firestore document, so this write can never clobber anyone else's
      // entry the way a shared JSON blob could.
      const docRef = db.collection('leaderboard').doc(state.profile.uid);
      if(optedIn){
        await docRef.set({
          name: myName,
          state: myState,
          country: myCountry,
          points: pts,
          level: level.name,
          streak: overallStreak(),
          best: bestStreakEver(),
          niyams: niyamSummaries(),
          updatedAt: Date.now()
        });
      } else {
        await docRef.delete();
      }

      // If this profile recently switched to a stable Google-account uid,
      // remove the old device-specific entry it was pushing under so the
      // leaderboard doesn't show the same person twice under one name.
      let clearedLegacy = null;
      if(hasLegacyCleanup){
        await db.collection('leaderboard').doc(state.profile.legacyUid).delete().catch(() => {});
        clearedLegacy = state.profile.legacyUid;
      }

      // Self-healing cleanup for orphaned duplicates that legacyUid alone
      // doesn't catch — e.g. signing in with Google on one device and
      // Apple on another before this device ever recorded the other's uid
      // as "legacy". Query for any OTHER entry matching this profile's
      // name + state + country and remove it, so a stray duplicate doesn't
      // just sit there forever. Note: this match is case-sensitive on the
      // exact name text, unlike the old in-memory version.
      if(myName){
        const dupSnap = await db.collection('leaderboard')
          .where('name', '==', myName)
          .where('state', '==', myState)
          .where('country', '==', myCountry)
          .get();
        const toDelete = dupSnap.docs.filter(doc => doc.id !== state.profile.uid);
        if(toDelete.length){
          const batch = db.batch();
          toDelete.forEach(doc => batch.delete(doc.ref));
          await batch.commit();
        }
      }

      leaderboardSyncWarned = false;
      lastPushedSignature = signature;
      if(clearedLegacy){
        state.profile.legacyUid = '';
        await safeStorageSet(KEY, JSON.stringify(state));
      }
    } catch(e){
      // Network errors, or a missing Firestore composite index on first
      // run — Firestore's error message includes a direct "create index"
      // link in that case; click it once and the duplicate-cleanup query
      // above will work from then on.
      console.warn('Leaderboard sync failed:', e);
      if(!leaderboardSyncWarned){ leaderboardSyncWarned = true; showToast('Leaderboard sync had trouble — will retry'); }
    }
  }

  async function fetchLeaderboard(){
    if(!firebaseReady) return null;
    try{
      const [scoresSnap, configSnap] = await Promise.all([
        db.collection('leaderboard').orderBy('points', 'desc').get(),
        db.collection('config').doc('leaderboard').get()
      ]);
      const blocked = new Set((configSnap.exists && configSnap.data().blockedUids) || []);
      return scoresSnap.docs
        .filter(doc => !blocked.has(doc.id))
        .map(doc => ({ uid: doc.id, ...doc.data() }));
    } catch(e){ return null; }
  }

  // Unfiltered version for the management screen — deliberately includes
  // blocked/anonymous/duplicate entries so they can be told apart by their
  // points/state/last-updated time and picked out individually, since name
  // alone isn't enough to distinguish anonymous or duplicate rows.
  async function fetchRawBoard(){
    if(!firebaseReady) return null;
    try{
      const [scoresSnap, configSnap] = await Promise.all([
        db.collection('leaderboard').orderBy('points', 'desc').get(),
        db.collection('config').doc('leaderboard').get()
      ]);
      const blocked = (configSnap.exists && configSnap.data().blockedUids) || [];
      const entries = scoresSnap.docs.map(doc => ({ uid: doc.id, ...doc.data() }));
      return { entries, blocked };
    } catch(e){ return null; }
  }

  // Groups raw board entries by normalized name so likely duplicates
  // (e.g. the same person signed in with Apple on one device and Google
  // on another, each creating its own identity) can be spotted and
  // pre-selected automatically instead of the admin having to manually
  // compare every row's points/id/date.
  function findDuplicateUids(entries){
    const groups = {};
    entries.forEach(e => {
      const key = (e.name || '').trim().toLowerCase();
      if(!key || key === 'anonymous') return; // don't group anonymous/blank names together
      (groups[key] = groups[key] || []).push(e);
    });
    const duplicateUids = new Set();
    const preSelectUids = new Set();
    Object.values(groups).forEach(group => {
      if(group.length < 2) return;
      group.forEach(e => duplicateUids.add(e.uid));
      // Keep whichever entry was updated most recently; pre-select the rest.
      const sorted = group.slice().sort((a,b) => (b.updatedAt||0) - (a.updatedAt||0));
      sorted.slice(1).forEach(e => preSelectUids.add(e.uid));
    });
    return { duplicateUids, preSelectUids };
  }

  async function openManageLeaderboard(){
    showManageModal = true;
    pushModalHistory();
    manageLoading = true;
    manageEntries = null;
    render();
    const result = await fetchRawBoard();
    if(result){
      manageEntries = result.entries;
      manageBlockedUids = result.blocked.slice();
      const { preSelectUids } = findDuplicateUids(result.entries);
      preSelectUids.forEach(uid => {
        if(!manageBlockedUids.includes(uid)) manageBlockedUids.push(uid);
      });
    } else {
      manageEntries = null;
    }
    manageLoading = false;
    render();
  }

  function toggleManageBlock(uid){
    const i = manageBlockedUids.indexOf(uid);
    if(i === -1) manageBlockedUids.push(uid); else manageBlockedUids.splice(i,1);
    render();
  }

  // Writes the blockedUids list to its own Firestore document. Since this
  // is a separate document from every leaderboard entry, an unrelated
  // score push from someone else's device can never clobber it — the
  // JSONBin-era retry/reassert workaround this used to need is gone.
  async function saveManageChanges(){
    manageSaving = true;
    render();
    if(!firebaseReady){
      showToast('No connection — try again when online');
      manageSaving = false;
      render();
      return;
    }
    try{
      await db.collection('config').doc('leaderboard').set({ blockedUids: manageBlockedUids.slice() }, { merge: true });
      showToast('Leaderboard updated');
      showManageModal = false;
    } catch(e){
      showToast('Could not save — check connection');
    }
    manageSaving = false;
    render();
  }

  async function openLeaderboard(){
    showLeaderboardModal = true;
    pushModalHistory();
    leaderboardLoading = true;
    leaderboardEntries = null;
    render();
    const entries = await fetchLeaderboard();
    leaderboardEntries = entries;
    leaderboardLoading = false;
    render();
  }

  async function refreshLeaderboard(){
    leaderboardLoading = true;
    render();
    const entries = await fetchLeaderboard();
    leaderboardEntries = entries;
    leaderboardLoading = false;
    render();
  }

  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(()=> t.classList.remove('show'), 1800);
  }

  // Looks up the target that was actually in effect on a given date, using
  // the niyam's target-change history — so editing today's target doesn't
  // retroactively re-grade (and steal points/streak from) earlier days that
  // were completed under an older target.
  function targetForDate(niyam, dateKey){
    const hist = niyam.targetHistory;
    if(!hist || !hist.length) return niyam.target || 1;
    let t = hist[0].target;
    for(const h of hist){
      if(h.date <= dateKey) t = h.target; else break;
    }
    return t;
  }

  function isNiyamDone(rec, niyam, dateKey){
    rec = rec || {};
    if(niyam.unit === 'check') return !!rec[niyam.id];
    const target = dateKey ? targetForDate(niyam, dateKey) : (niyam.target || 1);
    return (rec[niyam.id] || 0) >= target;
  }

  // Only niyams whose "active from" date has arrived — and haven't yet
  // reached their "ends on" date, if set — count toward a given day's
  // total/streak. Past history stays intact either way.
  function activeNiyamsFor(dateKey){
    return state.niyams.filter(n =>
      (!n.startDate || n.startDate <= dateKey) &&
      (!n.endDate || dateKey <= n.endDate)
    );
  }

  function doneCount(dateKey){
    const rec = state.checkins[dateKey] || {};
    return activeNiyamsFor(dateKey).filter(n => isNiyamDone(rec, n, dateKey)).length;
  }

  function isDayComplete(dateKey){
    const total = activeNiyamsFor(dateKey).length;
    if(!total) return false;
    return doneCount(dateKey) === total;
  }

  function totalPoints(){
    let pts = 0;
    for(const date in state.checkins){
      const total = activeNiyamsFor(date).length;
      const done = doneCount(date);
      pts += done * 10;
      if(total && done === total) pts += 20;
    }
    return pts;
  }

  // --- Special-day challenges ---
  // Fixed-date ones live here. Lunar-calendar days that shift every year
  // aren't handled yet — this only supports a fixed month/day per entry.
  // EDIT ME: fill in the real name and challenge text for each date.
  const SPECIAL_DAYS = [
    { month: 8,  day: 15, name: 'August 15', challenge: 'Special challenge for this day — edit SPECIAL_DAYS in index.html.' },
    { month: 11, day: 13, name: 'November 13', challenge: 'Special challenge for this day — edit SPECIAL_DAYS in index.html.' },
    { month: 3,  day: 18, name: 'March 18', challenge: 'Special challenge for this day — edit SPECIAL_DAYS in index.html.' }
  ];

  function nextOccurrence(month, day){
    const now = new Date();
    const todayMid = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    let d = new Date(now.getFullYear(), month - 1, day);
    if(d < todayMid) d = new Date(now.getFullYear() + 1, month - 1, day);
    return d;
  }

  function daysUntil(date){
    const now = new Date();
    const todayMid = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    return Math.round((date - todayMid) / 86400000);
  }

  function upcomingSpecialDay(){
    let best = null;
    SPECIAL_DAYS.forEach(sd => {
      const occ = nextOccurrence(sd.month, sd.day);
      const du = daysUntil(occ);
      if(best === null || du < best.daysUntil) best = Object.assign({}, sd, { date: occ, daysUntil: du });
    });
    return best;
  }

  // Tells the native app to schedule yearly 7-days-before reminders for
  // every entry in SPECIAL_DAYS. No-op on web (no native bridge there).
  function syncSpecialDayNotifications(){
    if(!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.scheduleSpecialDayNotifications)) return;
    try{
      window.webkit.messageHandlers.scheduleSpecialDayNotifications.postMessage({ days: SPECIAL_DAYS });
    } catch(e){ /* no-op */ }
  }

  // Standard Apple/Google brand marks for sign-in buttons — required by
  // both companies' own sign-in button design guidelines, not decorative.
  const APPLE_LOGO_SVG = `<svg width="17" height="17" viewBox="0 0 384 512" fill="currentColor" style="flex-shrink:0;"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg>`;
  const GOOGLE_LOGO_SVG = `<svg width="17" height="17" viewBox="0 0 48 48" style="flex-shrink:0;"><path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/><path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/><path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/><path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/></svg>`;

  function levelLabel(level){
    return `Level ${level.num}`;
  }

  function levelFor(pts){
    let cur = LEVELS[0];
    for(const l of LEVELS){ if(pts >= l.min) cur = l; }
    return cur;
  }

  function overallStreak(){
    if(!state.niyams.length) return 0;
    let streak = 0;
    let cursor = new Date();
    const t = todayStr();
    if(!isDayComplete(t)) cursor.setDate(cursor.getDate()-1);
    while(true){
      const key = keyFor(cursor);
      const total = activeNiyamsFor(key).length;
      if(total && doneCount(key) >= total){ streak++; cursor.setDate(cursor.getDate()-1); } else break;
    }
    return streak;
  }

  function bestStreakEver(){
    const dates = Object.keys(state.checkins);
    if(!state.niyams.length || !dates.length) return 0;
    const minKey = dates.reduce((a,b)=> a<b?a:b);
    let cursor = parseKey(minKey);
    const end = new Date();
    let cur = 0, best = 0;
    while(cursor <= end){
      const key = keyFor(cursor);
      const total = activeNiyamsFor(key).length;
      if(total && doneCount(key) === total){ cur++; if(cur > best) best = cur; }
      else cur = 0;
      cursor.setDate(cursor.getDate()+1);
    }
    return best;
  }

  function niyamSummaries(){
    return state.niyams.map(n => {
      const start = n.startDate || state.profile.joinDate || todayStr();
      let cursor = parseKey(start);
      const end = n.endDate ? parseKey(n.endDate) : new Date();
      let totalDays = 0, doneDays = 0;
      while(cursor <= end){
        const key = keyFor(cursor);
        totalDays++;
        const rec = state.checkins[key] || {};
        if(isNiyamDone(rec, n, key)) doneDays++;
        cursor.setDate(cursor.getDate()+1);
      }
      const pct = totalDays ? Math.round((doneDays/totalDays)*100) : 0;
      return { name: n.name, startDate: start, endDate: n.endDate || null, doneDays, totalDays, pct };
    });
  }

  // Points/days-practiced within an inclusive date range. Works on plain
  // string comparison since keys are always zero-padded YYYY-MM-DD.
  function periodStats(startKey, endKey){
    let pts = 0, days = 0, completions = 0;
    for(const date in state.checkins){
      if(date < startKey || date > endKey) continue;
      const total = activeNiyamsFor(date).length;
      const done = doneCount(date);
      if(done > 0) days++;
      completions += done;
      pts += done * 10;
      if(total && done === total) pts += 20;
    }
    return { pts, days, completions };
  }

  // Sums the actual amount logged per niyam within a date range — e.g. 11
  // jap + 11 jap + 11 jap = 33 — rather than just counting how many days
  // hit target. Check-type niyams report a days-done count instead, since
  // there's no quantity to sum.
  function niyamPeriodTotals(startKey, endKey){
    return state.niyams.map(n => {
      let total = 0, daysDone = 0, daysInRange = 0;
      const from = (n.startDate && n.startDate > startKey) ? n.startDate : startKey;
      const to = (n.endDate && n.endDate < endKey) ? n.endDate : endKey;
      if(from <= to){
        let cursor = parseKey(from);
        const end = parseKey(to);
        while(cursor <= end){
          const key = keyFor(cursor);
          daysInRange++;
          const rec = state.checkins[key] || {};
          if(n.unit === 'check'){
            if(rec[n.id]) daysDone++;
          } else {
            total += (rec[n.id] || 0);
          }
          cursor.setDate(cursor.getDate()+1);
        }
      }
      return { name: n.name, unit: n.unit, total, daysDone, daysInRange };
    });
  }

    const pts = totalPoints();

    const streak = overallStreak();
    const best = bestStreakEver();
    const daysPracticed = totalDaysPracticed();
    const name = state.profile.name || 'A practitioner';
    const lines = [];
    lines.push(`Niyam practice report for ${name}`);
    lines.push(`As of ${new Date().toLocaleDateString(undefined, { year:'numeric', month:'long', day:'numeric' })}`);
    lines.push('');
    lines.push(`Level: ${levelLabel(level)}`);
    lines.push(`Total points: ${pts}`);
    lines.push(`Current streak: ${streak} day(s)`);
    lines.push(`Best streak: ${best} day(s)`);
    lines.push(`Days practiced: ${daysPracticed}`);

  // A hard delete used to just drop the niyam from state.niyams — but every
  // point/streak calculation re-derives "how many niyams were active" from
  // the CURRENT state.niyams list, so deleting one silently rewrote every
  // past day's totals too, stealing points that were already earned. If the
  // niyam has any logged history, retire it (like "end this niyam") instead
  // of removing it outright — past days keep counting it, it just stops
  // showing up from today onward. Only a niyam with zero history is safe to
  // truly remove.
  function removeNiyam(id){
    const niyam = state.niyams.find(n => n.id === id);
    if(!niyam) return;
    const hasHistory = Object.values(state.checkins).some(rec =>
      rec && Object.prototype.hasOwnProperty.call(rec, id));
    if(hasHistory){
      const t = todayStr();
      if(!niyam.endDate || niyam.endDate > t) niyam.endDate = t;
      showToast('Ended — past days keep their points');
    } else {
      state.niyams = state.niyams.filter(n => n.id !== id);
    }
    saveState();
    render();
  }

  function setTarget(id, value){
    const niyam = state.niyams.find(n => n.id === id);
    if(!niyam) return;
    let val = Number(value);
    if(isNaN(val) || val < 1) val = 1;
    // Record this as a dated change rather than just overwriting a single
    // number — so days already logged under the old target keep being
    // graded against the target that was actually active then, and don't
    // retroactively lose their points/streak when the target changes later.
    if(!niyam.targetHistory || !niyam.targetHistory.length){
      niyam.targetHistory = [{ date: niyam.startDate || todayStr(), target: niyam.target || 1 }];
    }
    const effectiveDate = selectedKey();
    const hist = niyam.targetHistory;
    const existing = hist.find(h => h.date === effectiveDate);
    if(existing){ existing.target = val; }
    else { hist.push({ date: effectiveDate, target: val }); hist.sort((a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0); }
    niyam.target = val;
    saveState();
    render();
  }

  // --- Username & password account recovery ---
  // Firebase Auth needs an email, not an arbitrary username, so we
  // synthesize an internal one from the username the person actually
  // sees and types. This is never shown anywhere in the UI.
  function usernameToEmail(username){
    const clean = (username || '').trim().toLowerCase().replace(/[^a-z0-9_.-]/g, '');
    return clean + '@omysadhana.app';
  }

  // Used for BOTH brand-new signups and existing users adding a password
  // to their current account. The tricky part: pushGoogleUserData()
  // stores data keyed by the raw googleUser.sub (no prefix) — NOT by
  // state.profile.uid (which has a "g_" prefix added on top). So the
  // dataUid this links to must match whichever key the data ACTUALLY
  // lives under, or a later username/password login finds nothing.
  async function signUpWithUsername(username, password, confirmPassword){
    if(!firebaseReady) return { ok:false, error:'No connection — try again when online.' };
    const clean = (username || '').trim();
    if(clean.length < 3) return { ok:false, error:'Username must be at least 3 characters.' };
    if(!password || password.length < 6) return { ok:false, error:'Password must be at least 6 characters.' };
    if(password !== confirmPassword) return { ok:false, error:'Passwords don\u2019t match.' };

    const email = usernameToEmail(clean);
    try{
      const cred = await auth.createUserWithEmailAndPassword(email, password);
      const authUid = cred.user.uid;

      // Linking a password onto an EXISTING Google/Apple account: use
      // the same raw sub that pushGoogleUserData already stores data
      // under, so logging in later with just username/password finds it.
      // Otherwise (pure local/manual account, no Google/Apple at all):
      // there's no existing cloud data yet, so this new Firebase Auth
      // uid becomes the canonical one going forward.
      const dataUid = googleUser ? googleUser.sub : authUid;

      await db.collection('usernameLinks').doc(authUid).set({ dataUid });
      touchProfile();
      state.profile.username = clean;
      state.profile.hasUsernameAuth = true;
      state.profile.passwordPromptDismissed = true;
      if(!googleUser){
        // No other sync path exists for a pure local/manual account —
        // push right now so there's actually something to find if this
        // person logs in from a different device later.
        state.profile.uid = dataUid;
        await pushUserDataToUid(dataUid);
      }
      await safeStorageSet(KEY, JSON.stringify(state));
      saveState();
      return { ok:true };
    } catch(e){
      if(e.code === 'auth/email-already-in-use') return { ok:false, error:'That username is taken — try another.' };
      if(e.code === 'auth/weak-password') return { ok:false, error:'Password must be at least 6 characters.' };
      if(e.code === 'auth/invalid-email') return { ok:false, error:'Use only letters, numbers, and . _ - in your username.' };
      return { ok:false, error:'Could not create account — check your connection and try again.' };
    }
  }

  // For a new/wiped device: signs in and pulls whichever account's data
  // this username+password is linked to, merging it into local state.
  async function logInWithUsername(username, password){
    if(!firebaseReady) return { ok:false, error:'No connection — try again when online.' };
    const email = usernameToEmail(username);
    try{
      const cred = await auth.signInWithEmailAndPassword(email, password);
      const authUid = cred.user.uid;
      const linkDoc = await db.collection('usernameLinks').doc(authUid).get();
      if(!linkDoc.exists) return { ok:false, error:'No account data found for this username.' };
      const dataUid = linkDoc.data().dataUid;
      const remoteDoc = await db.collection('users').doc(dataUid).get();
      if(!remoteDoc.exists) return { ok:false, error:'No saved data found for this account.' };
      const remote = remoteDoc.data();
      state = mergeStates(state, remote);
      state.profile.uid = dataUid;
      state.profile.username = (username || '').trim();
      state.profile.hasUsernameAuth = true;
      state.profile.onboarded = true;
      await safeStorageSet(KEY, JSON.stringify(state));
      return { ok:true };
    } catch(e){
      if(e.code === 'auth/invalid-credential' || e.code === 'auth/wrong-password' || e.code === 'auth/user-not-found'){
        return { ok:false, error:'Incorrect username or password.' };
      }
      return { ok:false, error:'Could not sign in — check your connection and try again.' };
    }
  }

  // --- Celebration animation: a few staggered firework bursts on a
  // full-screen canvas overlay, shown briefly when every niyam for a
  // day gets checked off. Pure canvas 2D, no external libraries. ---
  let fireworksRunning = false;
  function launchFireworks(){
    if(fireworksRunning) return;
    const canvas = document.getElementById('fireworks-canvas');
    if(!canvas) return;
    const ctx = canvas.getContext('2d');
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = window.innerWidth, h = window.innerHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.display = 'block';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    fireworksRunning = true;
    const colors = ['#FF9933', '#128807', '#FDF8EF', '#FFD86B', '#7FD1FF'];
    let particles = [];

    function burst(x, y){
      const count = 34 + Math.floor(Math.random() * 14);
      for(let i = 0; i < count; i++){
        const angle = (Math.PI * 2 * i) / count + Math.random() * 0.2;
        const speed = 2.6 + Math.random() * 3.2;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 1,
          decay: 0.012 + Math.random() * 0.012,
          color: colors[Math.floor(Math.random() * colors.length)],
          size: 1.6 + Math.random() * 1.8
        });
      }
    }

    // Stagger 3 bursts across the upper portion of the screen.
    const burstPoints = [
      { x: w * 0.28, y: h * 0.32 },
      { x: w * 0.72, y: h * 0.26 },
      { x: w * 0.5,  y: h * 0.4  }
    ];
    burstPoints.forEach((p, i) => setTimeout(() => burst(p.x, p.y), i * 260));

    const start = performance.now();
    const maxDuration = 2200;

    function frame(now){
      ctx.clearRect(0, 0, w, h);
      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.045; // gentle gravity
        p.life -= p.decay;
        if(p.life > 0){
          ctx.globalAlpha = Math.max(p.life, 0);
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
        }
      });
      ctx.globalAlpha = 1;
      particles = particles.filter(p => p.life > 0);

      if(now - start < maxDuration || particles.length > 0){
        requestAnimationFrame(frame);
      } else {
        ctx.clearRect(0, 0, w, h);
        canvas.style.display = 'none';
        fireworksRunning = false;
      }
    }
    requestAnimationFrame(frame);
  }

  // --- Native daily notification bridge ---
  // The web version has no equivalent (browsers can't reliably deliver
  // scheduled notifications at a fixed time), so this only does anything
  // inside the native app, where ContentView.swift listens for this
  // message and schedules/updates a local notification for 12pm today
  // with the given percentage. Called after every state change and once
  // on load, so the scheduled notification always reflects the latest
  // progress rather than going stale.
  function computeTodayPercent(){
    const total = state.niyams.length;
    if(!total) return 0;
    return Math.round((doneCount(todayStr()) / total) * 100);
  }

  function syncNativeNotification(){
    if(!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.scheduleNotification)) return;
    try{
      window.webkit.messageHandlers.scheduleNotification.postMessage({ percent: computeTodayPercent() });
    } catch(e){ /* no-op */ }
  }

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function unitLabel(unit){
    if(unit === 'min') return 'min';
    if(unit === 'count') return '';
    return '';
  }

  function renderStatsHtml(){
    const t = todayStr();
    const pts = totalPoints();
    const level = levelFor(pts);
    const streak = overallStreak();
    const dayComplete = isDayComplete(t);
    const special = upcomingSpecialDay();
    const specialBanner = (special && special.daysUntil <= 14) ? `
      <div class="niyam-item" style="border-color:var(--gold);margin-bottom:12px;">
        <div>
          <div style="font-weight:600;color:var(--gold);">
            ${special.daysUntil === 0 ? `${escapeHtml(special.name)} is today!` : `${escapeHtml(special.name)} in ${special.daysUntil} day${special.daysUntil===1?'':'s'}`}
          </div>
          <div class="modal-sub" style="margin-top:2px;">${escapeHtml(special.challenge)}</div>
        </div>
      </div>
    ` : '';

    return `
      ${specialBanner}
      <div class="status ${dayComplete ? 'complete' : ''}">
        <div>
          <div class="level" onclick="App.showLevels()">${levelLabel(level)}</div>
          <div class="pts">${pts} points</div>
        </div>
        <div class="streak ${streak > 0 ? 'lit' : ''}">🔥 <span class="n">${streak}</span> day streak</div>
      </div>
    `;
  }

  function updateStatsBar(){
    const el = document.getElementById('statsWrap');
    if(el) el.innerHTML = renderStatsHtml();
  }

  function renderOnboardingHtml(){
    const needsState = onboardDraft.country === 'United States';
    const isLogin = onboardMode === 'login';
    return `
      <div class="onboard">
        <div class="onboard-card">
          <div class="om-big">ॐ</div>
          <h1>${isLogin ? 'Welcome back' : 'Welcome'}</h1>
          <div class="onboard-sub">${isLogin ? 'Log in with your username and password to restore your account.' : 'Before you begin, tell us a little about yourself. This is used for your profile and the leaderboard.'}</div>
          ${!isLogin ? (IS_NATIVE_APP && !googleUser ? `
            <div class="onboard-google">
              ${HAS_NATIVE_GOOGLE ? `<button class="modal-close" onclick="App.nativeGoogleSignIn()" style="margin-bottom:8px;display:flex;align-items:center;justify-content:center;gap:8px;">${GOOGLE_LOGO_SVG}Sign in with Google</button>` : ''}
              <button class="modal-close" onclick="App.nativeAppleSignIn()" style="display:flex;align-items:center;justify-content:center;gap:8px;">${APPLE_LOGO_SVG}Sign in with Apple</button>
              <div class="onboard-google-sub">Sign in to load your profile automatically, or create a username & password below.</div>
            </div>
          ` : (GOOGLE_CONFIGURED && !googleUser ? `
            <div class="onboard-google">
              <div id="googleSignInBtnOnboard"></div>
              <div class="onboard-google-sub">Sign in to load your profile automatically, or create a username & password below.</div>
            </div>
          ` : '')) : ''}
          <div class="onboard-form">
            ${!isLogin ? `
            <div>
              <label class="field-label">Name</label>
              <input class="profile-input" type="text" placeholder="Your name" value="${escapeHtml(onboardDraft.name)}"
                oninput="App.onOnboardName(this.value)" />
            </div>
            <div>
              <label class="field-label">Country</label>
              <select class="profile-input" onchange="App.onOnboardCountry(this.value)">
                ${COUNTRIES.map(c => `<option value="${c}" ${onboardDraft.country === c ? 'selected' : ''}>${c}</option>`).join('')}
              </select>
            </div>
            ${needsState ? `
            <div>
              <label class="field-label">State</label>
              <select class="profile-input" onchange="App.onOnboardState(this.value)">
                <option value="" ${!onboardDraft.state ? 'selected' : ''}>Select a state…</option>
                ${US_STATES.map(s => `<option value="${s}" ${onboardDraft.state === s ? 'selected' : ''}>${s}</option>`).join('')}
              </select>
            </div>` : ''}
            ` : ''}
            <div>
              <label class="field-label">Username</label>
              <input class="profile-input" type="text" autocapitalize="off" autocorrect="off" placeholder="Choose a username" value="${escapeHtml(onboardDraft.username)}"
                oninput="App.onOnboardUsername(this.value)" />
            </div>
            <div>
              <label class="field-label">Password</label>
              <input class="profile-input" type="password" placeholder="${isLogin ? 'Your password' : 'At least 6 characters'}" value="${escapeHtml(onboardDraft.password)}"
                oninput="App.onOnboardPassword(this.value)" />
            </div>
            ${!isLogin ? `
            <div>
              <label class="field-label">Re-enter Password</label>
              <input class="profile-input" type="password" placeholder="Re-enter your password" value="${escapeHtml(onboardDraft.confirmPassword)}"
                oninput="App.onOnboardConfirmPassword(this.value)" />
            </div>` : ''}
            ${onboardError ? `<div style="color:#ff8a8a;font-size:13px;">${escapeHtml(onboardError)}</div>` : ''}
            <button class="onboard-btn" ${onboardBusy ? 'disabled' : ''} onclick="App.submitOnboarding()">${onboardBusy ? 'Please wait…' : (isLogin ? 'Log In' : 'Begin')}</button>
            <div class="modal-sub" style="text-align:center;margin-top:2px;">
              ${isLogin
                ? `Don\u2019t have an account? <a href="#" onclick="event.preventDefault();App.switchOnboardMode('signup')">Sign up</a>`
                : `Already have an account? <a href="#" onclick="event.preventDefault();App.switchOnboardMode('login')">Log in</a>`}
            </div>
          </div>
        </div>
      </div>
    `;
  }

  function render(){
    const app = document.getElementById('app');
    if(!state.profile.onboarded){
      app.innerHTML = renderOnboardingHtml();
      initGoogleSignIn();
      renderGoogleButtonIfNeeded();
      return;
    }
    const t = todayStr();
    const selKey = selectedKey();
    const isToday = selKey === t;
    const isFuture = selKey > t;
    const rec = state.checkins[selKey] || {};

    // Only show niyams that had already started as of the day being viewed —
    // keeps past days accurate for niyams added later, and keeps streaks
    // honest about when each niyam actually began.
    const visibleNiyams = activeNiyamsFor(selKey);
    const upcomingNiyams = state.niyams.filter(n => n.startDate && n.startDate > selKey);

    const niyamHtml = visibleNiyams.map(n => {
      const done = isNiyamDone(rec, n, selKey);
      const editable = n.unit !== 'check';
      const actualVal = editable ? (rec[n.id] || 0) : 0;
      const control = `<div class="check" onclick="App.toggleCheck('${n.id}')" title="Tap to mark full target done / not done">${done?'✓':''}</div>`;
      const targetText = editable ? `Target: ${n.target}${n.unit==='min' ? ' min' : ''}` : '';
      const isEditing = editingTargetId === n.id;
      const startedLabel = n.startDate && n.startDate !== state.profile.joinDate ? `<div class="niyam-start">since ${parseKey(n.startDate).toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' })}</div>` : '';
      const endedLabel = n.endDate ? `<div class="niyam-start">ended ${parseKey(n.endDate).toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' })}</div>` : '';
      const isEditingEnd = editingEndId === n.id;
      const endEditRow = isEditingEnd ? `
        <div class="target-edit" onclick="event.stopPropagation()">
          <div class="slider-value-row">
            <span class="sv-label">${n.endDate ? 'Change end date' : 'End this niyam on'}</span>
          </div>
          <input id="endDate-${n.id}" class="profile-input" type="date" value="${n.endDate || selKey}" min="${n.startDate || ''}" />
          <div class="row" style="margin-top:6px;">
            <button onclick="App.setEndDate('${n.id}', document.getElementById('endDate-${n.id}').value)" style="flex:1;">Set end date</button>
            ${n.endDate ? `<button onclick="App.clearEndDate('${n.id}')" style="flex:1;background:rgba(255,255,255,0.06);color:var(--cream);">Resume (clear)</button>` : ''}
          </div>
        </div>` : '';
      const actualControl = editable ? `
        <div class="amount-control" onclick="event.stopPropagation()">
          <span class="sv-label" style="margin-right:2px;">Actual:</span>
          <input type="number" min="0" step="1" value="${actualVal}"
            onchange="App.setActual('${n.id}', this.value)" />
          <span class="unit">${n.unit==='min' ? 'min' : ''} / ${n.target}</span>
        </div>` : '';
      const editRow = (editable && isEditing) ? `
        <div class="target-edit" onclick="event.stopPropagation()">
          <div class="slider-value-row">
            <span class="sv-label">Target amount${n.unit==='min' ? ' (min)' : ''}</span>
          </div>
          <div class="target-input-row">
            <input id="targetNum-${n.id}" type="number" min="1" step="1" value="${n.target}"
              onchange="App.setTarget('${n.id}', this.value)" />
            <button onclick="App.setTarget('${n.id}', document.getElementById('targetNum-${n.id}').value)">Save</button>
          </div>
        </div>` : '';
      return `
        <div class="niyam-item ${done?'done':''}" id="row-${n.id}">
          <div class="niyam-row">
            ${control}
            <div class="niyam-main">
              <div class="niyam-name">${escapeHtml(n.name)}</div>
              ${targetText ? `<div class="niyam-target" ${editable ? `onclick="App.toggleEditTarget('${n.id}')"` : ''}>${targetText}${editable ? ' ✎' : ''}</div>` : ''}
              ${startedLabel}
              ${endedLabel}
              <div class="niyam-start" style="cursor:pointer;text-decoration:underline;" onclick="App.toggleEditEnd('${n.id}')">${n.endDate ? 'change end date' : 'end this niyam…'}</div>
            </div>
            <button class="niyam-del" onclick="App.remove('${n.id}')">✕</button>
          </div>
          ${actualControl}
          ${editRow}
          ${endEditRow}
        </div>`;
    }).join('') || `<div style="color:var(--muted);font-size:13px;">${state.niyams.length ? 'No niyams active yet on this day.' : 'Add your first niyam below — nothing is added by default.'}</div>`;

    const upcomingHtml = (isToday && upcomingNiyams.length) ? `
      <div style="color:var(--muted);font-size:11px;margin-top:8px;">
        Starting soon: ${upcomingNiyams.map(n => `${escapeHtml(n.name)} (${parseKey(n.startDate).toLocaleDateString(undefined,{month:'short',day:'numeric'})})`).join(', ')}
      </div>` : '';

    const addedNames = new Set(state.niyams.map(n=>n.name));
    const availablePresets = PRESETS.filter(p => !addedNames.has(p.name));
    const presetOptions = availablePresets.map(p => `<option value="${escapeHtml(p.name)}">${escapeHtml(p.name)}</option>`).join('');

    const dateLabel = isToday ? 'Today' : selectedDate.toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric' });
    const dateSub = selectedDate.toLocaleDateString(undefined, { year:'numeric', month:'short', day:'numeric' });

      <div id="statsWrap">${renderStatsHtml()}</div>

          <span onclick="App.switchDayTab('niyams')" style="cursor:pointer;${activeDayTab==='niyams' ? 'color:var(--gold);' : 'opacity:0.55;'}">Your Niyams</span>
          <span style="margin:0 6px;opacity:0.3;">·</span>
          <span onclick="App.switchDayTab('fasting')" style="cursor:pointer;${activeDayTab==='fasting' ? 'color:var(--gold);' : 'opacity:0.55;'}">Fasting</span>
        </span>
        <span class="viewing">${isToday ? '' : (isFuture ? 'planning ' + dateLabel : 'editing ' + dateLabel)}</span>
      </div>

      ${activeDayTab === 'fasting' ? (() => {
        const fastRec = state.fasting[selKey] || null;
        const fasted = !!(fastRec && fastRec.fasted);
        const fastType = (fastRec && fastRec.type) || 'full';
        const typeLabels = { full:'Full day', partial:'Partial day', water:'Water only', custom:'Other' };
        return `
        <div class="niyam-item" style="flex-direction:column;align-items:stretch;">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
            <div>
              <div style="font-weight:600;">Did you fast${isToday ? ' today' : ` on ${dateLabel}`}?</div>
            </div>
            <div class="check ${fasted ? 'done' : ''}" style="flex-shrink:0;" onclick="App.onToggleFasting()">${fasted ? '✓' : ''}</div>
          </div>
          ${fasted ? `
            <div style="margin-top:12px;display:flex;gap:6px;flex-wrap:wrap;">
              ${Object.keys(typeLabels).map(key => `
                <button type="button" onclick="App.onFastingTypeChange('${key}')" style="padding:6px 12px;font-size:12px;border-radius:999px;border:1px solid var(--line);background:${fastType===key ? 'var(--gold)' : 'transparent'};color:${fastType===key ? 'var(--bg)' : 'var(--cream)'};cursor:pointer;">${typeLabels[key]}</button>
              `).join('')}
            </div>
          ` : ''}
        </div>
        <div class="modal-sub" style="margin-top:10px;">${totalFastingDays()} fasting day${totalFastingDays()===1?'':'s'} logged in total.</div>
        `;
      })() : `
      <div class="niyam-list">${niyamHtml}</div>
      ${upcomingHtml}

      <div class="add-niyam">
        <select onchange="App.onPresetChange(this.value); this.selectedIndex=0;">
          <option value="" disabled selected>+ Add a niyam…</option>
          ${presetOptions}
          <option value="__custom__">✎ Custom niyam…</option>
        </select>
        ${showCustomForm ? `
          <div class="custom-form">
            <input id="customName" type="text" placeholder="Niyam name" maxlength="60" value="${escapeHtml(draftNiyam.name)}" />
            <select id="customUnit" onchange="App.toggleCustomTarget(this.value)">
              <option value="count" ${draftNiyam.unit==='count'?'selected':''}>Count</option>
              <option value="min" ${draftNiyam.unit==='min'?'selected':''}>Minutes</option>
              <option value="check" ${draftNiyam.unit==='check'?'selected':''}>Yes / No</option>
            </select>
            <div id="customTargetField" class="slider-field" style="display:${draftNiyam.unit==='check'?'none':'block'};">

              </div>
              <input id="customTargetNum" type="number" min="1" step="1" value="${draftNiyam.target}" />
            </div>
            <div>
              <label class="field-label" style="margin:4px 0 4px;">Active from</label>
              <input id="customStartDate" class="profile-input" type="date" value="${draftNiyam.startDate || todayStr()}" max="${maxFutureKey()}" />
            </div>
            <div class="row" style="margin-top:4px;">

              <button onclick="App.cancelAdd()" style="flex:1;background:rgba(255,255,255,0.06);color:var(--cream);">Cancel</button>
            </div>
          </div>
        ` : ''}
      </div>
      `}

    `;

      initGoogleSignIn();

  function renderLevelListHtml(){
    const pts = totalPoints();
    const current = levelFor(pts);
    return LEVELS.map(l => {
      const isCurrent = l.name === current.name;
      return `
        <div class="level-row ${isCurrent ? 'current' : ''}">
          <div class="lname">${levelLabel(l)}</div>
          <div class="lpts">${l.min} pts${isCurrent ? ' · your level' : ''}</div>
        </div>`;
    }).join('');
  }

  function recentHistoryHtml(){
    const total = state.niyams.length;
    let rows = '';
    for(let i=0;i<14;i++){
      const d = new Date();
      d.setDate(d.getDate()-i);
      const key = keyFor(d);
      const done = doneCount(key);
      const label = d.toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric' });
      const full = total > 0 && done === total;
      rows += `
        <div class="history-row ${full ? 'full' : ''}">
          <span>${label}</span>
          <span class="hcount">${total ? done + '/' + total : '—'}</span>
        </div>`;
    }
    return rows;
  }

    return `
      <h2>Profile</h2>

      <label class="field-label">Name</label>
      <input class="profile-input" type="text" value="${escapeHtml(state.profile.name || '')}"

      <label class="field-label">Country</label>
      <select class="profile-input" onchange="App.onProfileCountry(this.value)">
